# Publica a pasta site/ no GitHub Pages a cada push na main.
#
# Usamos uma action em vez de "deploy from branch" porque o Pages so
# aceita a raiz ou /docs como origem, e aqui o site mora em site/.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez; nao cancela a que ja esta correndo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir que os dados do trajeto existem
        run: |
          test -f site/data/days.json || { echo "::error::site/data/days.json nao esta no repositorio. Rode scripts/build_trail.py e faca commit."; exit 1; }
          test -f site/data/summary.json || { echo "::error::site/data/summary.json faltando."; exit 1; }
          test -f site/data/media.json || echo "::warning::media.json ausente; o site vai abrir sem fotos."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
